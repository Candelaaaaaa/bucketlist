name: Deploy to Firebase Hosting

on:
  push:
    branches: [ main, master ]          # despliega en cada push a la rama principal
  pull_request:
    branches: [ main, master ]          # opcional: despliega pre‑visualizaciones

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout del código
      - uses: actions/checkout@v4

      # 2️⃣ Instalar Node (versión LTS)
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'            # coincide con la versión que usaste localmente
          cache: 'npm'

      # 3️⃣ Instalar dependencias
      - name: Install dependencies
        run: npm ci

      # 4️⃣ Build (Vite → carpeta dist/)
      - name: Build
        run: npm run build

      # 5️⃣ Deploy a Firebase
      - name: Deploy to Firebase
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          npm install -g firebase-tools
          firebase deploy --only hosting --project bucketlist-48805 --token "$FIREBASE_TOKEN"
